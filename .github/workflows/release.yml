name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub's job-level maximum (6 h). Cold-cache embedding on a 2-vCPU
    # runner has unbounded variance; the cache primes after the first run.
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write   # for `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm   # (E)

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Resolve upstream SHA
        id: upstream
        run: |
          SHA=$(git ls-remote https://github.com/razorpay/markdown-docs HEAD | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "upstream sha: $SHA"

      # (A) Cache built indexes + cloned source. Keyed on upstream SHA — most
      # tag pushes reuse the indexes from a recent ci.yml run.
      # save-always so the cache is populated even if a later step (test,
      # eval, publish) fails — next attempt benefits.
      - name: Cache built indexes + source
        id: cache-indexes
        uses: actions/cache@v4
        with:
          path: |
            dist/index
            source
          key: indexes-bge-small-${{ steps.upstream.outputs.sha }}-v1
          restore-keys: |
            indexes-bge-small-
          save-always: true

      # (B) Cache HuggingFace model weights.
      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: node_modules/@huggingface/transformers/.cache
          key: hf-bge-small-en-v1.5-v1
          save-always: true

      - name: Build indexes (cache miss)
        if: steps.cache-indexes.outputs.cache-hit != 'true'
        run: |
          pnpm indexer:pull
          pnpm exec tsx src/indexer/main.ts build:bm25
          pnpm exec tsx src/indexer/main.ts build:vec --embedder=small
          pnpm exec tsx src/indexer/main.ts build:rules

      - name: Citation gate (cache hit — re-verify against cached source)
        if: steps.cache-indexes.outputs.cache-hit == 'true'
        run: pnpm exec tsx src/indexer/main.ts build:rules

      # Build dist/server.js BEFORE tests — handshake test spawns it.
      - name: Build
        run: pnpm build

      - name: Typecheck + lint + test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm cspell:check
          pnpm test

      - name: Eval — full release gate
        run: pnpm eval --report eval/reports/release.md

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access=public --provenance
