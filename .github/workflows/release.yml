name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write   # for `npm publish --provenance`
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Set up pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Pull docs source + build indexes
        run: |
          pnpm indexer:pull
          pnpm exec tsx src/indexer/main.ts build:bm25
          pnpm exec tsx src/indexer/main.ts build:vec --embedder=small
          pnpm exec tsx src/indexer/main.ts build:rules

      - name: Typecheck + lint + test
        run: |
          pnpm typecheck
          pnpm lint
          pnpm cspell:check
          pnpm test

      - name: Eval — full release gate
        run: pnpm eval --report eval/reports/release.md

      - name: Build
        run: pnpm build

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm publish --no-git-checks --access=public --provenance
